    <meta name="description" content="French-language illustrated history book tied to Assassin&#x27;s Creed Shadows, the fifth in Larousse&#x27;s &quot;Discovery Book by Assassin&#x27;s Creed&quot; series. It covers 16th-century Japan, the age of samurai and ninja, with a double page per theme across seven parts: medieval Japan, between seas and mountains, society and daily life, religions, arts and sports, agriculture and food, and economic life. Topics include Buddhist temples and Shinto shrines, village and castle life, clothing, sumo, Noh theatre, the tea ceremony, money and taxes, and a page on Yasuke, the African samurai. Naoe and Yasuke are on the cover. Foreword by Stéphanie-Anne Ruatta of the Assassin&#x27;s Creed Shadows team. Published by Larousse under the direction of Carine Girac-Marinier, 28 May 2025, €19.95 (ISBN 9782036056565).">
