    <meta name="description" content="French-language illustrated history book based on Discovery Tour: Ancient Egypt from Assassin&#x27;s Creed Origins, and with La Grèce antique the first of Larousse&#x27;s &quot;Discovery Book by Assassin&#x27;s Creed&quot; series (tagline &quot;L&#x27;histoire est notre terrain de jeu&quot;). Illustrated almost entirely with game art and concept art, it covers daily life in ancient Egypt, the pyramids and how they were built, embalming and mummification, the lands of the Nile and the tombs of the dead, up to Egypt in Cleopatra&#x27;s time, with &quot;Dans le jeu&quot; boxes comparing the game with history. Aya and Bayek are on the cover. For readers aged 10 and up, recommended to go with the French 6e history curriculum. Published by Larousse under the direction of Carine Girac-Marinier, 23 September 2020, €14.95 (ISBN 9782035982810).">
