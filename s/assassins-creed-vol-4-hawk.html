    <meta name="description" content="Volume 4 of 6. When Desmond Miles is called away on an urgent mission, he entrusts fellow Assassin Jonathan Hawk with File 24. Hawk sets out to search for the Scepter of Isis, a powerful ancient artifact lost in time. Through his Assassin ancestor, El Cakr, Hawk travels to Mamluk Egypt in 1340, where the Templars have stolen the Scepter from the Sultan. Pursued in the present by the formidable Templar agent Vernon Hest, Hawk finds himself in a race against time. The first album of the second cycle, featuring an all-new Assassin in an all-new era. Written by Eric Corbeyran and drawn by Djillali Defali. Published in English by Titan Books (November 2013); originally published in French by Les Deux Royaumes (November 2012).">
