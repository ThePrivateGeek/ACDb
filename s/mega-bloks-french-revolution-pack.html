    <meta name="description" content="Five micro action figures from Assassin&#x27;s Creed Unity with a small barricade to build (set 94320, also numbered CNC64; Mega Bloks&#x27; own site called it the French Revolution Battalion). Officially licensed by Ubisoft and made by Mega Bloks (MEGA Brands, part of Mattel since 2014) as one of its Assassin&#x27;s Creed Collector Construction Sets. The 116-piece pack has an unnamed Assassin in a green coat, a brown hood and a red sash, and four French soldiers in blue coats. The barricade is built around a cart wheel, with a barrel, sandbags and a pole that hoists a cloth tricolour on a string. Muskets with bayonets, a sabre and a pistol are included. Announced as a seventh set after the 2014 launch wave and released in 2015, for ages 10 and up. It was re-issued later in 2015 with four figures and 98 pieces (set CNK24).">
