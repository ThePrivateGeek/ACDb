    <meta name="description" content="European (PAL) re-release of Assassin&#x27;s Creed II for Xbox 360 and PlayStation 3, also called the Lineage Edition. The standard game case comes in a white cardboard box marked &quot;Special Film Edition&quot;, together with the Assassin&#x27;s Creed Lineage short film on DVD: the 36-minute live-action prequel directed by Yves Simoneau, in which Giovanni Auditore (Romano Orzari) is sent to find out who murdered the Duke of Milan. The box also adds two bonus Templar lair maps, Santa Maria dei Frari and Palazzo Medici, and three lithographs from the comic Assassin&#x27;s Creed 1: Desmond in a printed envelope. Gameswelt gave its release as 4 March 2010 and its recommended price as €74.95.">
