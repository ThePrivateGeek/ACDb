    <meta name="description" content="Five micro action figures from Assassin&#x27;s Creed IV Black Flag with a small beach scene to build (set 94305, also numbered CNF06). Officially licensed by Ubisoft and made by Mega Bloks (MEGA Brands, part of Mattel since 2014) as one of its Assassin&#x27;s Creed Collector Construction Sets. The 111-piece pack has an unnamed Assassin in white robes and a red sash, a pirate captain and three pirates. The scene is a pirate cove with a black Assassin flag, a treasure chest with gold coins and a stack of cargo. Cutlasses, pistols and a hidden blade are included, and the Assassin&#x27;s hood, robe and sash come off. Part of the first wave of six sets, released in late 2014, for ages 10 and up. It was re-issued in 2015 with four figures and 97 pieces (set CNK22).">
