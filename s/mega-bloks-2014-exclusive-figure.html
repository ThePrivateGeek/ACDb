    <meta name="description" content="A promotional micro action figure given away free by Mega Bloks in 2014, sealed in a printed bag marked &quot;2014 Exclusive Figure&quot; (item 99708). Officially licensed by Ubisoft and made by Mega Bloks (MEGA Brands, part of Mattel since 2014) for its Assassin&#x27;s Creed Collector Series. The figure is a bearded Assassin in pirate dress: an orange hood, a brown coat over a striped shirt and an orange sash, with a pistol, a cutlass and a hidden blade, on a small stand to build. The bag gives no name; fan lists call him Edward Kenway. Mega Bloks announced an event-exclusive figure for New York Comic Con in October 2014, though some sellers list this one as a San Diego Comic-Con exclusive. Never sold in shops. 18 pieces, for ages 10 and up.">
