    <meta name="description" content="Five micro action figures from Assassin&#x27;s Creed Brotherhood with a small scene to build (set 94306, also numbered CNF07). Officially licensed by Ubisoft and made by Mega Bloks (MEGA Brands, part of Mattel since 2014) as one of its Assassin&#x27;s Creed Collector Construction Sets. The 122-piece pack has an unnamed Assassin in cream robes and a red sash and four Borgia guards. The scene is a stone tunnel entrance, the fast-travel point of Brotherhood&#x27;s Rome. Halberds, swords and a hidden blade are included, and the Assassin&#x27;s hood, robe and sash come off. Part of the first wave of six sets, released in late 2014, for ages 10 and up. It was re-issued in 2015 with four figures and 106 pieces (set CNK23).">
