    <meta name="description" content="Building block model of the Jackdaw, Edward Kenway&#x27;s brig from Assassin&#x27;s Creed IV Black Flag, and the largest set in WISEBLOCK&#x27;s Black Flag Series (set HA395107). Officially licensed by Ubisoft and made by WISEBLOCK, the building-block brand of Alpha Group. The 3,781-piece ship stands on a display base and comes with two sets of sails, black and white, a choice of pirate or Assassin flag, a removable captain&#x27;s cabin and 52 cannons; turning a cask on deck runs the broadside cannons in and out. Eight minifigures are included: Edward Kenway, Adéwalé, Blackbeard, Mary Read, Bartholomew Roberts, Charles Vane, Jack Rackham and Benjamin Hornigold. The finished ship is about 81.5 cm long and 61.7 cm tall (32.1 x 24.3 in). Released in the US in June 2026, for ages 18 and up.">
