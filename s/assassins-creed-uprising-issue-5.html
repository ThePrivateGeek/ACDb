    <meta name="description" content="Issue 5 of 12. While Charlotte tries to get traitor Guernica to spill the beans, My&#x27;Shell comes back to the Assassin HQ with a badly beaten Berg. That&#x27;s senior Templar Master Otso Berg. The Assassins, especially Galina, are shall we say less than keen to see him. A very wary temporary truce of sorts is called, and both sides discuss what they know of the new group. Essentially both groups are now compromised, with Juno followers in place within both Assassins and Templars, and only one or two of them known at this point. A reluctant alliance is formed to find and secure the Koh-i-Noor jewel, a Piece of Eden Juno is after. So, off to the Animus again for Charlotte. Written by Dan Watters &amp; Alex Paknadel. Art by Jose Holder. Published by Titan Comics.">
