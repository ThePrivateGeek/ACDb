    <meta name="description" content="Building block diorama of Havana&#x27;s waterfront from Assassin&#x27;s Creed IV Black Flag, part of WISEBLOCK&#x27;s Black Flag Series (set HA395106). Officially licensed by Ubisoft and made by WISEBLOCK, the building-block brand of Alpha Group. The 2,399-piece harbour has a tavern, a blacksmith&#x27;s shop, a white twin-towered church and a fountain square, with a rowing boat and a jetty at the water&#x27;s edge. The rooftops flip up and the walls turn to show the rooms inside, and Edward crosses a rope strung from the rooftops to the church. Hidden touches include a treasure chest uncovered by twisting a gear, a secret door that swings round and a hay cart for Edward to hide in. Six minifigures are included: Edward Kenway, Stede Bonnet, Governor Laureano de Torres, Bartholomew Roberts, a blacksmith and a townswoman. The finished model is about 57.7 cm wide, 41.7 cm deep and 31.2 cm tall (22.7 x 16.4 x 12.3 in). Released in the US in June 2026, for ages 18 and up.">
