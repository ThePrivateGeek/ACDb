    <meta name="description" content="Physical-only launch edition of Assassin&#x27;s Creed Black Flag Resynced for PlayStation 5 and Xbox Series X, released 9 July 2026 at €59.99 (£49.99 in the UK). The game comes in a cardboard sleeve marked &quot;Launch Edition&quot;, with a 34-page art book of concept art, character explorations and environment art, a double-sided world map poster with a map of the Caribbean on one side and game artwork on the other, and the Blackbeard&#x27;s Crimson Pack (Crimson costume, sword and pistol). Sold in limited quantities while supplies lasted, mainly in Europe; Eurogamer reported it would not be sold in the US. Some retailers added an exclusive steelbook (MediaMarkt and Saturn in Germany, JB Hi-Fi in Australia), which is not part of the edition itself.">
